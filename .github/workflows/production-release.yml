name: Unified Production Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. v1.0.0"
        required: true
        type: string
      expected_commit:
        description: "Exact approved Git commit SHA"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: henry-hub-production-release
  cancel-in-progress: false

jobs:
  build:
    name: Test and build both artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout approved release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit }}
          fetch-depth: 0

      - name: Verify release identity
        env:
          VERSION: ${{ inputs.version }}
          EXPECTED: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          ACTUAL="$(git rev-parse HEAD)"
          TAG="$(git rev-parse "${VERSION}^{commit}")"
          test "$ACTUAL" = "$EXPECTED"
          test "$TAG" = "$EXPECTED"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run automated tests
        run: |
          pytest -q \
            --ignore=tests/test_ollama_live.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Cloudflare Worker
        run: |
          npx --yes wrangler@4.146.0 deploy --dry-run

      - name: Build versioned Linux and Worker artifacts
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          mkdir -p dist/linux dist/worker

          git archive --format=tar.gz \
            --prefix="henry-hub-${VERSION}/" \
            HEAD > "dist/henry-hub-linux-${VERSION}.tar.gz"

          tar -czf "dist/henry-hub-worker-${VERSION}.tar.gz" \
            worker.js wrangler.toml

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          commit = os.environ["COMMIT"]
          files = [
              Path(f"dist/henry-hub-linux-{version}.tar.gz"),
              Path(f"dist/henry-hub-worker-{version}.tar.gz"),
          ]

          artifacts = []
          for path in files:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              artifacts.append({
                  "filename": path.name,
                  "sha256": digest,
                  "size_bytes": path.stat().st_size,
              })

          manifest = {
              "version": version,
              "commit": commit,
              "artifacts": artifacts,
              "database_migration_policy": "backup-before-migration; additive migrations only",
              "deployment_status": "built-not-deployed",
          }

          Path("dist/release-manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n"
          )
          PY

          cd dist
          sha256sum \
            "henry-hub-linux-${VERSION}.tar.gz" \
            "henry-hub-worker-${VERSION}.tar.gz" \
            release-manifest.json > SHA256SUMS

      - name: Upload immutable build outputs
        uses: actions/upload-artifact@v4
        with:
          name: production-release-${{ inputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite it."
            exit 1
          fi

          gh release create "$VERSION" dist/* \
            --verify-tag \
            --title "Henry Hub ${VERSION}" \
            --notes "Unified Linux and Cloudflare Worker artifacts built from commit $GITHUB_SHA. See release-manifest.json and SHA256SUMS for artifact identity and integrity."
