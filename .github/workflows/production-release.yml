name: Production Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version without leading v (e.g. 1.0.1)"
        required: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest jsonschema
      - name: Gate on tests and Worker validation
        run: |
          if [ -d tests ]; then pytest -q --ignore=tests/test_ollama_live.py; fi
          node --input-type=module --check < worker.js
          npx --yes wrangler@4 deploy --dry-run --outdir /tmp/worker-dryrun
      - name: Build and verify coordinated release artifacts
        id: build
        run: |
          VER="${{ github.event.inputs.version || '' }}"
          if [ -z "$VER" ]; then VER="${GITHUB_REF_NAME#v}"; fi
          CODE_VER="$(python3 -c 'import sys; sys.path.insert(0, "release"); import version; print(version.VERSION)')"
          if [ "$VER" != "$CODE_VER" ]; then
            echo "ERROR: release/version.py ($CODE_VER) does not match requested release ($VER)" >&2
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          bash scripts/build_release.sh "$VER" "${GITHUB_SHA}" "dist/$VER"
          bash scripts/verify_release.sh "dist/$VER" "v$VER"
      - name: Publish approved GitHub Release and dispatch production deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.build.outputs.version }}"
          TAG="${{ steps.build.outputs.tag }}"
          gh release create "$TAG" \
            "dist/$VER/quant-hub-${VER}-linux.tar.gz" \
            "dist/$VER/quant-gateway-${VER}-worker.tar.gz" \
            "dist/$VER/release-manifest-${VER}.json" \
            "dist/$VER/SHA256SUMS" \
            "dist/$VER/RELEASE_NOTES.md" \
            --title "$TAG" \
            --notes-file "dist/$VER/RELEASE_NOTES.md"
          DEFAULT_BRANCH="$(gh repo view --json defaultBranchRef -q .defaultBranchRef.name)"
          gh workflow run production-deploy.yml --ref "$DEFAULT_BRANCH" -f release_tag="$TAG" || true
